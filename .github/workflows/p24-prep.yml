name: Aegis P24 Prep

on:
  push:
    branches:
      - "aegis/plugin-distribution-contract-v0.1"
    paths:
      - ".github/workflows/p24-prep.yml"

permissions:
  contents: read

jobs:
  generate-p24-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute Project State cache
        run: python3 -m tools.aegis_state.cli recompute . --write
      - name: Regenerate beta.2 release manifest
        run: python3 scripts/build_aegis_distributions.py --version 0.1.0-beta.2 --write-manifest
      - name: Regenerate native Plugin materialization
        run: python3 scripts/build_openai_plugin_materialization.py --release-version 0.1.0-beta.2 --write
      - name: Verify generated candidate
        run: |
          python3 -m tools.aegis_state.cli validate .
          python3 -m tools.aegis_state.cli check .
          python3 -m tools.aegis_skillset.cli validate .
          python3 scripts/build_skillset.py --check
          python3 -m tools.aegis_skillset.cli distribution-check .
          python3 scripts/build_aegis_distributions.py --version 0.1.0-beta.2 --check
          python3 scripts/build_openai_plugin_materialization.py --release-version 0.1.0-beta.2 --check
      - name: Build P24 candidate Installation Kit
        run: |
          rm -rf /tmp/aegis-p24-beta2
          mkdir -p /tmp/aegis-p24-beta2
          python3 scripts/build_aegis_distributions.py \
            --version 0.1.0-beta.2 \
            --installation-kit-archive-dir /tmp/aegis-p24-beta2
      - name: Stage generated outputs
        run: |
          mkdir -p /tmp/aegis-p24-prep/generated
          mkdir -p /tmp/aegis-p24-prep/skillset/releases
          cp .aegis/state.json /tmp/aegis-p24-prep/generated/state.json
          cp .agents/plugins/marketplace.json /tmp/aegis-p24-prep/generated/marketplace.json
          cp plugins/aegis/.codex-plugin/plugin.json /tmp/aegis-p24-prep/generated/plugin.json
          cp skillset/releases/aegis-0.1.0-beta.2.json /tmp/aegis-p24-prep/skillset/releases/aegis-0.1.0-beta.2.json
          cp -a plugins /tmp/aegis-p24-prep/plugins
          cp /tmp/aegis-p24-beta2/aegis-skill-installation-kit-0.1.0-beta.2.zip /tmp/aegis-p24-prep/
      - name: Upload P24 prep outputs
        uses: actions/upload-artifact@v4
        with:
          name: aegis-p24-prep-v0.1.0-beta.2
          path: /tmp/aegis-p24-prep
          if-no-files-found: error
