name: Aegis Project State Integrity

on:
  push:
    paths:
      - ".aegis/**"
      - "docs/project-state-manifest-v*.md"
      - "docs/self-hosting-manifest-adoption-v0.1.md"
      - "docs/dogfood/**"
      - "docs/superpowers/specs/*project-state*.md"
      - "docs/superpowers/specs/*self-hosting*.md"
      - "docs/superpowers/plans/*project-state*.md"
      - "docs/superpowers/plans/*self-hosting*.md"
      - "evals/cases/dogfood.json"
      - "schemas/project-state/**"
      - "tools/aegis_state/**"
      - "tests/project_state/**"
      - "examples/project-state/**"
      - "skillset/skills/aegis-project-state/**"
      - "skills/aegis-project-state/**"
      - "skills/aegis/**"
      - ".github/workflows/project-state.yml"
  pull_request:
    paths:
      - ".aegis/**"
      - "docs/project-state-manifest-v*.md"
      - "docs/self-hosting-manifest-adoption-v0.1.md"
      - "docs/dogfood/**"
      - "docs/superpowers/specs/*project-state*.md"
      - "docs/superpowers/specs/*self-hosting*.md"
      - "docs/superpowers/plans/*project-state*.md"
      - "docs/superpowers/plans/*self-hosting*.md"
      - "evals/cases/dogfood.json"
      - "schemas/project-state/**"
      - "tools/aegis_state/**"
      - "tests/project_state/**"
      - "examples/project-state/**"
      - "skillset/skills/aegis-project-state/**"
      - "skills/aegis-project-state/**"
      - "skills/aegis/**"
      - ".github/workflows/project-state.yml"

concurrency:
  group: project-state-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse project-state v0.3, v0.4, and v0.5 schemas
        run: |
          for version in v0.3 v0.4 v0.5; do
            for schema in schemas/project-state/$version/*.json; do
              python3 -m json.tool "$schema" >/dev/null
            done
          done
      - name: Validate minimal v0.4 project manifests
        run: python3 -m tools.aegis_state.cli validate examples/project-state/minimal
      - name: Check generated minimal v0.4 project state
        run: |
          if ! python3 -m tools.aegis_state.cli check examples/project-state/minimal; then
            python3 -m tools.aegis_state.cli recompute examples/project-state/minimal > /tmp/minimal-state.json
            diff -u examples/project-state/minimal/.aegis/state.json /tmp/minimal-state.json || true
            exit 1
          fi
      - name: Validate minimal v0.5 project manifests
        run: python3 -m tools.aegis_state.cli validate examples/project-state/v0.5-minimal
      - name: Check generated minimal v0.5 project state
        run: |
          if ! python3 -m tools.aegis_state.cli check examples/project-state/v0.5-minimal; then
            python3 -m tools.aegis_state.cli recompute examples/project-state/v0.5-minimal > /tmp/minimal-v05-state.json
            diff -u examples/project-state/v0.5-minimal/.aegis/state.json /tmp/minimal-v05-state.json || true
            exit 1
          fi
      - name: Run project-state unit tests
        run: python3 -m unittest discover -s tests/project_state -v

  self-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Aegis root v0.4 manifests
        run: python3 -m tools.aegis_state.cli validate .
      - name: Check Aegis root generated v0.4 state
        run: |
          if ! python3 -m tools.aegis_state.cli check .; then
            python3 -m tools.aegis_state.cli recompute . > /tmp/root-state.json
            diff -u .aegis/state.json /tmp/root-state.json || true
            exit 1
          fi
      - name: Validate Aegis skillset
        run: python3 -m tools.aegis_skillset.cli validate .
      - name: Run Aegis skillset regressions
        run: python3 -m unittest discover -s tests/skillset -v
      - name: Validate Aegis evaluation corpus
        run: python3 evals/scripts/validate_corpus.py
      - name: Run Aegis evaluation regressions
        run: python3 -m unittest discover -s evals/tests -v
