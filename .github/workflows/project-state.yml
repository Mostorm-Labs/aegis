name: Aegis Project State Integrity

on:
  push:
    paths:
      - ".aegis/**"
      - "docs/project-state-manifest-v*.md"
      - "docs/superpowers/specs/*project-state*.md"
      - "docs/superpowers/plans/*project-state*.md"
      - "schemas/project-state/**"
      - "tools/aegis_state/**"
      - "tests/project_state/**"
      - "examples/project-state/**"
      - "skills/aegis/**"
      - ".github/workflows/project-state.yml"
  pull_request:
    paths:
      - ".aegis/**"
      - "docs/project-state-manifest-v*.md"
      - "docs/superpowers/specs/*project-state*.md"
      - "docs/superpowers/plans/*project-state*.md"
      - "schemas/project-state/**"
      - "tools/aegis_state/**"
      - "tests/project_state/**"
      - "examples/project-state/**"
      - "skills/aegis/**"
      - ".github/workflows/project-state.yml"

concurrency:
  group: project-state-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse project-state v0.3 schemas
        run: |
          for schema in schemas/project-state/v0.3/*.json; do
            python3 -m json.tool "$schema" >/dev/null
          done
      - name: Validate minimal v0.3 project manifests
        run: python3 -m tools.aegis_state.cli validate examples/project-state/minimal
      - name: Check generated minimal v0.3 project state
        run: python3 -m tools.aegis_state.cli check examples/project-state/minimal
      - name: Run project-state unit tests
        run: python3 -m unittest discover -s tests/project_state -v
