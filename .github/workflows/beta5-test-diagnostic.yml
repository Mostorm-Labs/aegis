name: Beta5 skillset regression diagnostic

on:
  push:
    branches: [feat/repo-local-execution-authority]
    paths: [".beta5-test-diagnostic/READY"]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete skillset regressions and persist failure
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests/skillset -v > .beta5-skillset-test.log 2>&1
          status=$?
          cat .beta5-skillset-test.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .beta5-skillset-test.log
            git commit -m "chore: persist beta.5 skillset regression diagnostic"
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$status"
          fi
