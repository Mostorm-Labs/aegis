name: Aegis Control Plane CP-I09 Plugin Profile

on:
  push:
    branches: [chatgpt/control-plane-cp-i09-plugin-profile-implementation-v0.2]
  pull_request:
    paths:
      - ".github/workflows/control-plane-cp-i09-plugin-profile.yml"
      - "tests/control_plane/**"
      - "tests/skillset/**"
      - "skillset/dogfood/control-plane-v0.2-plugin-profile*.json"

jobs:
  contract-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m unittest discover -s tests/control_plane -v
  baseline-and-inheritance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m unittest tests.control_plane.test_cp_i08_d0 tests.control_plane.test_qualification -v
  pp0-deterministic-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m unittest tests.control_plane.test_cp_i09_plugin_profile -v
  skillset-plugin-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m unittest discover -s tests/skillset -v
      - run: python3 -m unittest discover -s tests/project_state -v
  combine-evidence:
    if: always()
    needs: [contract-regression, baseline-and-inheritance-check, pp0-deterministic-qualification, skillset-plugin-regression]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pp0-deterministic-qualification.result }}" = success
