name: Eval Corpus Integrity

on:
  push:
    paths:
      - "evals/**"
      - ".github/workflows/eval-corpus.yml"
  pull_request:
    paths:
      - "evals/**"
      - ".github/workflows/eval-corpus.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Aegis seed corpus
        run: python3 evals/scripts/validate_corpus.py
