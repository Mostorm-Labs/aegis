name: Aegis beta.5 branch bootstrap

on:
  push:
    branches:
      - feat/repo-local-execution-authority
    paths:
      - ".bootstrap-aegis-beta5/READY"

permissions:
  contents: write

jobs:
  apply-validated-change-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify change set
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-aegis-beta5/chunk-* > /tmp/aegis-beta5-changes.b64
          base64 -d /tmp/aegis-beta5-changes.b64 > /tmp/aegis-beta5-changes.tgz
          echo "d70be1ea9be8be6a7aed282a4e5fa93064a4adfb99e9fffa9214f05a473aaedd  /tmp/aegis-beta5-changes.tgz" | sha256sum -c -
          tar -xzf /tmp/aegis-beta5-changes.tgz -C .
          python3 -m unittest tests.skillset.test_repo_local_execution_authority -v
          python3 scripts/build_skillset.py --check
          python3 scripts/build_aegis_distributions.py --version 0.2.0-beta.5 --check
          python3 scripts/build_openai_plugin_materialization.py --release-version 0.2.0-beta.5 --check
      - name: Commit exact validated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap-aegis-beta5 .github/workflows/bootstrap-aegis-beta5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add repo-local execution authority"
          git push origin HEAD:${GITHUB_REF_NAME}
