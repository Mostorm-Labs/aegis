name: Aegis Skillset Integrity

on:
  push:
    paths:
      - "skillset/**"
      - "skills/**"
      - ".agents/plugins/**"
      - "plugins/aegis/**"
      - "tools/aegis_skillset/**"
      - "scripts/build_skillset.py"
      - "scripts/build_openai_plugin_materialization.py"
      - "scripts/build_candidate_plugin_parity.py"
      - "scripts/validate_generated_skills.py"
      - "tests/skillset/**"
      - "evals/providers/openai/bundle.py"
      - "docs/skill-decomposition-v0.1.md"
      - "docs/skill-decomposition-v0.2.md"
      - "docs/skill-decomposition-dogfood-v0.1.md"
      - "docs/skill-decomposition-dogfood-v0.2.md"
      - "docs/superpowers/specs/*skill-decomposition*.md"
      - "docs/superpowers/specs/*multi-skill-composition*.md"
      - "docs/superpowers/plans/*skill-decomposition*.md"
      - "docs/superpowers/plans/*multi-skill-composition*.md"
      - "docs/plugin-distribution-contract-v*.md"
      - "docs/superpowers/specs/*plugin-distribution*.md"
      - "docs/superpowers/plans/*plugin-distribution*.md"
      - "scripts/build_aegis_distributions.py"
      - ".github/workflows/skillset.yml"
  pull_request:
    paths:
      - "skillset/**"
      - "skills/**"
      - ".agents/plugins/**"
      - "plugins/aegis/**"
      - "tools/aegis_skillset/**"
      - "scripts/build_skillset.py"
      - "scripts/build_openai_plugin_materialization.py"
      - "scripts/build_candidate_plugin_parity.py"
      - "scripts/validate_generated_skills.py"
      - "tests/skillset/**"
      - "evals/providers/openai/bundle.py"
      - "docs/skill-decomposition-v0.1.md"
      - "docs/skill-decomposition-v0.2.md"
      - "docs/skill-decomposition-dogfood-v0.1.md"
      - "docs/skill-decomposition-dogfood-v0.2.md"
      - "docs/superpowers/specs/*skill-decomposition*.md"
      - "docs/superpowers/specs/*multi-skill-composition*.md"
      - "docs/superpowers/plans/*skill-decomposition*.md"
      - "docs/superpowers/plans/*multi-skill-composition*.md"
      - "docs/plugin-distribution-contract-v*.md"
      - "docs/superpowers/specs/*plugin-distribution*.md"
      - "docs/superpowers/plans/*plugin-distribution*.md"
      - "scripts/build_aegis_distributions.py"
      - ".github/workflows/skillset.yml"

concurrency:
  group: skillset-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-skillset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill identity and ownership
        run: python3 -m tools.aegis_skillset.cli validate .
      - name: Check generated distributions
        run: python3 scripts/build_skillset.py --check
      - name: Validate Aegis distribution contract
        run: python3 -m tools.aegis_skillset.cli distribution-check .
      - name: Check Aegis release manifest
        run: python3 scripts/build_aegis_distributions.py --check
      - name: Check published beta.3 release history
        run: python3 scripts/build_aegis_distributions.py --published-history --version 0.1.0-beta.3 --check
      - name: Check OpenAI native Plugin materialization
        run: python3 scripts/build_openai_plugin_materialization.py --published-history --release-version 0.1.0-beta.3 --check
      - name: Build Aegis test distribution source bundles
        run: python3 scripts/build_aegis_distributions.py --package-dir /tmp/aegis-plugin-dist
      - name: Upload Aegis test distribution source bundles
        uses: actions/upload-artifact@v4
        with:
          name: aegis-distributions-0.1.0-task6.1
          path: /tmp/aegis-plugin-dist/*.zip
          if-no-files-found: error
      - name: Upload Aegis Skill installation kit
        uses: actions/upload-artifact@v4
        with:
          name: aegis-skill-installation-kit-0.1.0-task6.1
          path: /tmp/aegis-plugin-dist/aegis-skills-0.1.0-task6.1/
          if-no-files-found: error
      - name: Build exact-head candidate Plugin parity evidence
        run: python3 scripts/build_candidate_plugin_parity.py --output /tmp/aegis-candidate-plugin-parity.json
      - name: Upload exact-head candidate Plugin parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-candidate-plugin-parity-${{ github.sha }}
          path: /tmp/aegis-candidate-plugin-parity.json
          if-no-files-found: error
      - name: Validate intended routing and handoffs
        run: python3 -m tools.aegis_skillset.cli routing-check .
      - name: Validate installed-platform rerun state
        run: python3 -m tools.aegis_skillset.cli installed-platform-check .
      - name: Validate generated standalone Skill structure
        run: python3 scripts/validate_generated_skills.py
      - name: Run skillset tests
        run: python3 -m unittest discover -s tests/skillset -v
      - name: Run Project State regressions
        run: python3 -m unittest discover -s tests/project_state -v
      - name: Validate protected Aegis evaluation corpus
        run: python3 evals/scripts/validate_corpus.py
      - name: Run Aegis evaluation regressions
        run: python3 -m unittest discover -s evals/tests -v
