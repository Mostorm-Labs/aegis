name: Aegis Control Plane CP-I05 Dispatch Reconciliation

on:
  push:
    paths:
      - "tools/aegis_control/**"
      - "tests/control_plane/test_cp_i05_*.py"
      - "tests/control_plane/cp_i05_*.py"
      - "tests/control_plane/generate_cp_i05_evidence.py"
      - "tests/control_plane/cp_i02_fixtures.py"
      - "tests/control_plane/reference_model.py"
      - "tests/control_plane/verifier_helpers.py"
      - ".github/workflows/control-plane-cp-i05.yml"
  pull_request:
    paths:
      - "tools/aegis_control/**"
      - "tests/control_plane/test_cp_i05_*.py"
      - "tests/control_plane/cp_i05_*.py"
      - "tests/control_plane/generate_cp_i05_evidence.py"
      - "tests/control_plane/cp_i02_fixtures.py"
      - "tests/control_plane/reference_model.py"
      - "tests/control_plane/verifier_helpers.py"
      - ".github/workflows/control-plane-cp-i05.yml"

permissions:
  contents: read

concurrency:
  group: control-plane-cp-i05-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run CP-I05 focused tests
        run: python3 -m unittest discover -s tests/control_plane -p 'test_cp_i05_*.py' -v
      - name: Run full Control Plane regression suite
        run: python3 -m unittest discover -s tests/control_plane -v
      - name: Run Project State regression suite
        run: python3 -m unittest discover -s tests/project_state -v
      - name: Run Skillset regression suite
        run: python3 -m unittest discover -s tests/skillset -v
      - name: Materialize CP-I05 evidence bundle
        env:
          PACKAGE_REF: d1e76563385bd03747aef2ee396855ec26496679
          RESULT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m tests.control_plane.generate_cp_i05_evidence \
            --result-revision "$RESULT_REVISION" \
            --package-ref "$PACKAGE_REF" \
            --output-dir artifacts/cp-i05
          for file in artifacts/cp-i05/*.json; do python3 -m json.tool "$file" >/dev/null; done
      - name: Upload CP-I05 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp-i05-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/cp-i05
          if-no-files-found: error
          retention-days: 30
