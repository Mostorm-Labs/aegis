name: Temporary Aegis beta.3 materialization

on:
  push:
    paths:
      - ".github/workflows/release-prep-beta3.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blocking-evidence-necessity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate canonical distributions and beta.3 metadata
        run: |
          python3 scripts/build_skillset.py --write
          python3 scripts/build_openai_plugin_materialization.py --release-version 0.2.0-beta.3 --write
          python3 scripts/build_aegis_distributions.py --version 0.2.0-beta.3 --write-manifest
      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills plugins/aegis skillset/releases/aegis-0.2.0-beta.3.json
          if git diff --cached --quiet; then
            echo "No generated drift"
            exit 0
          fi
          git commit -m "build: materialize Aegis v0.2.0-beta.3"
          git push origin HEAD:feat/blocking-evidence-necessity
