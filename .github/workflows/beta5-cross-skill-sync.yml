name: Beta5 cross-skill sync

on:
  push:
    branches: [feat/repo-local-execution-authority]
    paths: [".beta5-cross-skill/READY"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch canonical cross-skill contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'anchor missing: {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          def append_once(path, marker, text):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if marker not in s:
                  p.write_text(s.rstrip()+"\n\n"+text.strip()+"\n",encoding='utf-8')

          # Central router: P31 local materialization and P32 internal preflights.
          replace_once('skillset/skills/aegis/SKILL.md',
              '2. At `P31`, freeze an `EXECUTION_CLOSURE_CONTRACT` with required/forbidden changes, required tests/oracles, required vs optional hosted verification, blocking vs corroborative evidence, terminal success, explicit terminal blockers, and `continue_until_terminal_state: true`.\n',
              '2. At `P31`, freeze an `EXECUTION_CLOSURE_CONTRACT` with required/forbidden changes, required tests/oracles, required vs optional hosted verification, blocking vs corroborative evidence, terminal success, explicit terminal blockers, and `continue_until_terminal_state: true`.\n   When repository execution would otherwise repeatedly reconstruct upstream context, materialize the frozen execution truth under `.aegis/packages/<task-id>/` and hand the code surface a thin package trigger; legacy remote packages remain valid.\n')
          replace_once('skillset/skills/aegis/SKILL.md',
              '3. At `P32`, execute the complete frozen contract until terminal success or an explicit terminal blocker. Do not redesign upstream authority and do not return merely because an intermediate checkpoint finished.\n',
              '3. At `P32`, execute the complete frozen contract until terminal success or an explicit terminal blocker. Use internal ImplementationDesignPreflight / RED-oracle checkpoints when frozen/applicable, but do not add a control round trip when they resolve cleanly. Do not redesign upstream authority and do not return merely because an intermediate checkpoint finished.\n')

          # Verification: requirement != oracle != evidence; known-bad must RED when frozen.
          replace_once('skillset/skills/aegis-verification/SKILL.md',
              'This stage is responsible for Verification closure before implementation. Do not leave a list of "tests we would like to have" for later Gate review to turn into new blocking requirements. If a useful evidence idea does not uniquely detect a material uncovered failure mode, keep it corroborative or successor hardening.\n',
              'This stage is responsible for Verification closure before implementation. Do not leave a list of "tests we would like to have" for later Gate review to turn into new blocking requirements. If a useful evidence idea does not uniquely detect a material uncovered failure mode, keep it corroborative or successor hardening.\n\nKeep `requirement`, `oracle`, and `evidence` distinct. For known-bad old behavior behind a critical invariant, freeze a RED-oracle precondition when practical; if the old implementation passes that oracle while the requirement is still known unsatisfied, route `VERIFICATION_DESIGN_DEFECT` instead of letting implementation adapt the test.\n')

          # Gate: producer cannot self-pass.
          replace_once('skillset/skills/aegis-gate-review/SKILL.md',
              '- At `P34`, audit the frozen completion target through `Frozen Requirement Audit`, `Frozen Evidence Audit`, and `Repository Reality Audit`. P34 verifies frozen obligations; it does not normally redesign Verification after implementation starts. Agent claims are not evidence.\n',
              '- At `P34`, audit the frozen completion target through `Frozen Requirement Audit`, `Frozen Evidence Audit`, and `Repository Reality Audit`. P34 verifies frozen obligations; it does not normally redesign Verification after implementation starts. Agent claims are not evidence.\n- **Implementation Producer != Final Gate Reviewer.** `READY_FOR_CONTROL_REVIEW` is an execution return state, never a self-issued P34/Capability/Release PASS; resolve package/result/evidence independently on the review surface.\n')

          append_once('skillset/skills/aegis-verification/references/verification.md','## Requirement / oracle / evidence separation and RED Oracle Preflight',r'''
          ## Requirement / oracle / evidence separation and RED Oracle Preflight

          A frozen Verification obligation MUST keep three questions distinct:
          - `requirement`: what system behavior must be true;
          - `oracle`: what observation can falsify or accept that behavior;
          - `evidence`: the durable artifact/identity produced by running the oracle.

          A green test is evidence. It proves the requirement only to the extent that P20 has frozen that test/oracle as adequate coverage for the requirement and its material failure modes.

          For atomic publication, consistency, recovery, ordering, concurrency, transaction semantics, or another critical behavioral invariant where a known old implementation violates the requirement, P20 SHOULD freeze a RED precondition when practical:

          ```yaml
          oracle_precondition:
            red_required: true
            expected_failure: <behavior the old implementation must expose>
            observation_seam: <canonical observer boundary>
          ```

          P32/P33 then run the frozen acceptance oracle against the old implementation before production mutation. If the old implementation is known to violate the requirement but the oracle passes, stop with `VERIFICATION_DESIGN_DEFECT`. Do not let implementation rewrite the test around its preferred architecture.
          ''')

          append_once('skillset/skills/aegis-gate-review/references/gate-review.md','## Independent producer / reviewer boundary',r'''
          ## Independent producer / reviewer boundary

          **Implementation Producer != Final Gate Reviewer.** P32/P33 may return `READY_FOR_CONTROL_REVIEW` and exact durable result/evidence identities, but the implementation producer cannot self-issue P34 PASS, Capability PASS, G2 PASS, or Release PASS.

          P34 independently resolves the repo-local/legacy package, Authority and Verification bindings required for review, result identity, evidence graph, authorized scope, and hidden failure modes. For `repo_materialized`/`hybrid` packages, review the content-addressed locks first and reconcile upstream Notion only when freshness/supersession cannot be established locally or an explicit Authority reconciliation is required.

          The thin `surface_handoff` and executor summary are navigation only. They cannot substitute for package contents, repository reality, or machine evidence.
          ''')

          append_once('skillset/shared/handoff-contract.md','## Repo-local minimal surface handoff',r'''
          ## Repo-local minimal surface handoff

          When P31 has materialized `execution_authority_mode: repo_materialized | hybrid`, the normal code-surface transfer is a thin execution trigger:

          ```yaml
          type: surface_handoff
          task_id: <task-id>
          stage: P32
          stage_owner: aegis-implementation
          repository:
            provider: github
            full_name: <owner/repository>
          package:
            path: .aegis/packages/<task-id>/package.json
            materialization_ref: <exact-same-repository-ref>
          execution_ref: <branch-or-durable-ref>
          resume_cursor: null
          continue_until_terminal_state: true
          return_surface: CONTROL_REVIEW
          ```

          The handoff MUST NOT repeat full Authority prose, Verification prose, prior Gate history, or implementation interpretation already frozen inside the content-addressed package. The executor progressively loads `package.json`, `implementation-context.md`, and `execution-contract.json`; Authority/Verification locks are loaded only when the active step needs them.

          For local packages, Notion/source reconciliation is exception-driven: missing/unverifiable local binding, hash/source mismatch, explicit supersession ambiguity, Authority conflict, or explicit control request. Do not add a connector round trip merely to restate an internally valid frozen lock.
          ''')

          append_once('skillset/shared/core-invariants.md','## Execution Authority Materialization Invariant',r'''
          ## Execution Authority Materialization Invariant

          P31 may materialize the smallest execution-required Authority/Verification/closure truth into a content-addressed repo-local package. Once that package is frozen, normal P32/P33 execution progressively loads it and does not repeatedly reconstruct the same truth from human-readable upstream sources.

          A surface handoff is a thin trigger, not a second specification. P32/P33 internal ImplementationDesign/RED-oracle checkpoints continue in the same code execution context when resolved; only a real Authority, Verification, package, scope, or environment blocker creates an early control return.

          `READY_FOR_CONTROL_REVIEW != P34 PASS`. The implementation producer returns durable identities; the Gate reviewer independently decides downstream trust.
          ''')

          append_once('skillset/skills/aegis/references/implementation.md','## Repo-local execution authority (v0.2 additive mode)',r'''
          ## Repo-local execution authority (v0.2 additive mode)

          P31 SHOULD use `execution_authority_mode: repo_materialized` or `hybrid` when execution truth can be frozen in the target repository. The package lives under `.aegis/packages/<task-id>/` and content-addresses its Authority lock, Verification lock, closure contract, evidence contract, and short implementation context. Missing mode remains legacy `remote`; no Project State schema migration is required.

          P32/P33 progressively load the repo-local package rather than refetching upstream Notion by default. Architecture-sensitive tasks run `ImplementationDesignPreflight` internally; resolved designs continue without a human round trip. Critical behavioral obligations may require **RED Oracle Preflight** before mutation; a known-bad old implementation passing the frozen oracle is `VERIFICATION_DESIGN_DEFECT`.

          The normal code-surface sequence is `inspect -> design -> RED oracle -> implement -> debug -> regression -> verification -> durable materialization`. Successful execution returns `READY_FOR_CONTROL_REVIEW`; independent P34 still owns PASS.
          ''')

          p=Path('skillset/skills/aegis/references/stage-contracts.md'); s=p.read_text(encoding='utf-8')
          repl={
          '| P31 | Task Packaging | authority refs, scope/non-goals, required/forbidden changes, tests/oracles, blocking/corroborative evidence, terminal success/blockers in `EXECUTION_CLOSURE_CONTRACT` | blocking completion target is frozen; coding agent need not redesign system or infer finish criteria |':
          '| P31 | Task Packaging | authority refs, scope/non-goals, required/forbidden changes, tests/oracles, blocking/corroborative evidence, terminal success/blockers in `EXECUTION_CLOSURE_CONTRACT`; optional repo-local execution-authority materialization | blocking completion target is frozen; coding agent need not redesign system, refetch frozen upstream truth, or infer finish criteria |',
          '| P32 | Implementation | code/change, frozen required tests/evidence, durable result identities, terminal blocker if any | complete frozen closure contract reaches terminal success or explicit terminal blocker |':
          '| P32 | Implementation | code/change, P32/P33 internal PackageBinding/ImplementationDesign/RED-oracle checkpoints when applicable, frozen required tests/evidence, durable result identities, terminal blocker if any | complete frozen closure contract reaches terminal success/`READY_FOR_CONTROL_REVIEW` or explicit terminal blocker without ordinary checkpoint return |',
          '| P33 | Resume | current state/diff, completed work, pending work, safe continuation plus root-cause check for any newly introduced work | valid work is preserved; resume does not expand package; P20/P31 omissions route earlier |':
          '| P33 | Resume | current state/diff, `completed_through`, `next_action`, optional design/oracle cursor state, safe continuation plus root-cause check for newly introduced work | valid work is preserved; P32/P33 internal checkpoints resume without expanding package; P20/P31 omissions route earlier |'}
          for old,new in repl.items():
              if old not in s: raise SystemExit(f'stage-contract anchor missing: {old[:60]}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate exact-nine distributions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_skillset.py
          python3 scripts/build_aegis_distributions.py --version 0.2.0-beta.5
          python3 scripts/build_openai_plugin_materialization.py --release-version 0.2.0-beta.5
          python3 scripts/build_skillset.py --check
          python3 scripts/build_aegis_distributions.py --version 0.2.0-beta.5 --check
          python3 scripts/build_openai_plugin_materialization.py --release-version 0.2.0-beta.5 --check
          python3 -m unittest tests.skillset.test_repo_local_execution_authority -v
      - name: Commit generated coherent tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .beta5-cross-skill
          rm -f .github/workflows/beta5-cross-skill-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align verification gate and handoff contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
