name: Temporary Project State Recompute

on:
  push:
    branches:
      - "aegis/close-pr13-integration"

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests structurally
        run: python3 -m tools.aegis_state.cli validate .
      - name: Print fresh generated state
        run: python3 -m tools.aegis_state.cli recompute .
