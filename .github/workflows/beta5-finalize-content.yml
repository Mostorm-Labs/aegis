name: Beta5 finalize content

on:
  push:
    branches: [feat/repo-local-execution-authority]
    paths: [".beta5-finalize-content/READY"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply beta.5 canonical and release-surface edits
        shell: bash
        run: |
          set +e
          python3 scripts/beta5_finalize_wrapper.py > .beta5-finalize-error.log 2>&1
          status=$?
          cat .beta5-finalize-error.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .beta5-finalize-error.log
            git commit -m "chore: persist beta.5 finalizer diagnostic"
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$status"
          fi
          rm -f .beta5-finalize-error.log
      - name: Materialize deterministic beta.5 distributions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_skillset.py --write
          python3 scripts/build_aegis_distributions.py --version 0.2.0-beta.5 --write-manifest
          python3 scripts/build_openai_plugin_materialization.py --release-version 0.2.0-beta.5 --write
      - name: Verify beta.5 closure before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_skillset.py --check
          python3 scripts/build_aegis_distributions.py --version 0.2.0-beta.5 --check
          python3 scripts/build_openai_plugin_materialization.py --release-version 0.2.0-beta.5 --check
          python3 -m unittest tests.skillset.test_repo_local_execution_authority -v
          python3 -m unittest tests.skillset.test_openai_plugin_materialization -v
          python3 -m unittest tests.skillset.test_control_plane_v02_release_candidate -v
      - name: Commit coherent beta.5 content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs skillset skills plugins tests schemas scripts/aegis_execution_package.py
          git diff --cached --quiet && { echo 'no content changes'; exit 1; }
          git commit -m "Prepare coherent v0.2.0-beta.5 content"
          git push origin HEAD:${GITHUB_REF_NAME}
