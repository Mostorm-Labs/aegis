name: PD-P34-04 Valid Upgrade Fixture

on:
  push:
    branches:
      - aegis/pd-p34-04-valid-upgrade-b

permissions:
  contents: read

jobs:
  verify-release-b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skillset source
        run: python3 -m tools.aegis_skillset.cli validate .
      - name: Check coherent Release B manifest
        run: python3 scripts/build_aegis_distributions.py --version 0.1.0-beta.2 --check
      - name: Check Release B native Plugin materialization
        run: python3 scripts/build_openai_plugin_materialization.py --release-version 0.1.0-beta.2 --check
