name: Aegis Control Plane CP-I04 Historical Trust

on:
  push:
    paths:
      - "tools/aegis_control/**"
      - "tests/control_plane/test_cp_i04_*.py"
      - "tests/control_plane/cp_i04_*.py"
      - "tests/control_plane/generate_cp_i04_evidence.py"
      - "tests/control_plane/cp_i02_fixtures.py"
      - "tests/control_plane/reference_model.py"
      - "tests/control_plane/verifier_helpers.py"
      - ".github/workflows/control-plane-cp-i04.yml"
  pull_request:
    paths:
      - "tools/aegis_control/**"
      - "tests/control_plane/test_cp_i04_*.py"
      - "tests/control_plane/cp_i04_*.py"
      - "tests/control_plane/generate_cp_i04_evidence.py"
      - "tests/control_plane/cp_i02_fixtures.py"
      - "tests/control_plane/reference_model.py"
      - "tests/control_plane/verifier_helpers.py"
      - ".github/workflows/control-plane-cp-i04.yml"

permissions:
  contents: read

concurrency:
  group: control-plane-cp-i04-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run CP-I04 focused tests
        run: python3 -m unittest discover -s tests/control_plane -p 'test_cp_i04_*.py' -v
      - name: Run full Control Plane regression suite
        run: python3 -m unittest discover -s tests/control_plane -v
      - name: Run Project State regression suite
        run: python3 -m unittest discover -s tests/project_state -v
      - name: Run Skillset regression suite
        run: python3 -m unittest discover -s tests/skillset -v
      - name: Materialize CP-I04 evidence bundle
        env:
          PACKAGE_REF: 28e89118b68b3cf3eab1cf94ab65a20271e32c80
          RESULT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tests/control_plane/cp_i04_p36_evidence.py \
            --result-revision "$RESULT_REVISION" \
            --package-ref "$PACKAGE_REF" \
            --output-dir artifacts/cp-i04
          for file in artifacts/cp-i04/*.json; do python3 -m json.tool "$file" >/dev/null; done
      - name: Upload CP-I04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp-i04-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/cp-i04
          if-no-files-found: error
          retention-days: 30
